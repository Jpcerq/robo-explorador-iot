apiVersion: 1
datasources:
  - name: InfluxDB - Pintura
    uid: influx-pintura
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: fabrica
      defaultBucket: pintura
      httpMode: POST
      timeInterval: 2s
    secureJsonData:
      token: $INFLUXDB_READ_TOKEN
